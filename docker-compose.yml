services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Drop your real DEM GeoTIFF here as ./data/dem.tif on the host.
      # If the file isn't present, the backend automatically falls back
      # to the bundled synthetic test DEM so the service still boots.
      - ./data:/app/data:ro
    environment:
      - DEM_PATH=/app/data/dem.tif
      - GRID_SIZE=128
      - NVIDIA_API_KEY=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
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped