<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Astro-Dark | Telemetry Console</title>
    <meta name="description" content="Mission Copilot — Real-time lunar rover telemetry, anomaly detection, and AI copilot dashboard." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#38bdf8",
              "primary-bright": "#7dd3fc",
              "secondary": "#a78bfa",
              "status-nominal": "#10b981",
              "status-warning": "#f59e0b",
              "status-critical": "#ef4444",
              "panel-border": "rgba(56, 189, 248, 0.18)",
              "hud-border": "rgba(148, 163, 184, 0.15)",
              "hud-dark": "#070c18"
            },
            fontFamily: {
              "headline": ["Outfit", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
    </style>
  </head>
  <body class="font-body overflow-x-hidden pb-28 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
