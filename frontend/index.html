<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mission Copilot - Telemetry Dashboard (Week 1)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.3/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121822;
    --border: #1f2a37;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4da3ff;
    --danger: #ff5d5d;
    --ok: #33d17a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .status-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 20px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
  .dot.connected { background: var(--ok); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h3 { margin: 0 0 10px 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat { font-size: 26px; font-weight: 600; }
  .stat-sub { color: var(--muted); font-size: 12px; }
  canvas { max-height: 180px; }
  .controls {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .controls h3 { margin-top: 0; font-size: 13px; color: var(--muted); text-transform: uppercase; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    background: #1a2432;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  .alert-feed {
    margin-top: 16px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 13px;
  }
  .alert-item {
    padding: 6px 10px;
    border-left: 3px solid var(--danger);
    background: #1a1216;
    margin-bottom: 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>

<h1>🛰 Mission Copilot — Telemetry Dashboard</h1>
<div class="subtitle">Week 1: raw telemetry pipeline (backend → WebSocket → live charts)</div>

<div class="status-row">
  <div id="statusDot" class="dot"></div>
  <span id="statusText">Connecting...</span>
</div>

<div class="grid">
  <div class="panel">
    <h3>Battery</h3>
    <div class="stat" id="batteryStat">--%</div>
    <canvas id="batteryChart"></canvas>
  </div>

  <div class="panel">
    <h3>Motor Temperature (°C)</h3>
    <div class="stat-sub" id="motorStat">--</div>
    <canvas id="motorChart"></canvas>
  </div>

  <div class="panel">
    <h3>Tilt (deg)</h3>
    <div class="stat" id="tiltStat">--°</div>
    <canvas id="tiltChart"></canvas>
  </div>

  <div class="panel">
    <h3>Comms Signal</h3>
    <div class="stat" id="commsStat">--%</div>
    <canvas id="commsChart"></canvas>
  </div>
</div>

<div class="controls">
  <h3>Demo Controls — Fault Injection</h3>
  <div class="btn-row">
    <button onclick="injectFault('motor_temp_spike', 'front_left')">🔥 Spike Front-Left Motor Temp</button>
    <button onclick="injectFault('battery_drain', 'general')">🔋 Drain Battery</button>
    <button onclick="injectFault('comms_dropout', 'general')">📡 Comms Dropout</button>
    <button onclick="injectFault('tilt_spike', 'general')">⚠️ Tilt Spike</button>
  </div>
  <div class="alert-feed" id="alertFeed"></div>
</div>

<script>
const BACKEND_HTTP = "http://localhost:8000";
const BACKEND_WS = "ws://localhost:8000/ws/telemetry";
const MAX_POINTS = 40;

const chartDefaults = {
  responsive: true,
  animation: false,
  plugins: { legend: { display: false } },
  scales: {
    x: { display: false },
    y: { ticks: { color: "#8b98a5" }, grid: { color: "#1f2a37" } }
  }
};

function makeLineChart(ctx, color, label) {
  return new Chart(ctx, {
    type: "line",
    data: { labels: [], datasets: [{ label, data: [], borderColor: color, borderWidth: 2, pointRadius: 0, tension: 0.3 }] },
    options: chartDefaults
  });
}

const batteryChart = makeLineChart(document.getElementById("batteryChart"), "#4da3ff", "Battery");
const tiltChart = makeLineChart(document.getElementById("tiltChart"), "#ffb84d", "Tilt");
const commsChart = makeLineChart(document.getElementById("commsChart"), "#33d17a", "Comms");

const motorCtx = document.getElementById("motorChart");
const motorChart = new Chart(motorCtx, {
  type: "line",
  data: {
    labels: [],
    datasets: [
      { label: "front_left", data: [], borderColor: "#ff5d5d", borderWidth: 2, pointRadius: 0, tension: 0.3 },
      { label: "front_right", data: [], borderColor: "#4da3ff", borderWidth: 2, pointRadius: 0, tension: 0.3 },
      { label: "rear_left", data: [], borderColor: "#33d17a", borderWidth: 2, pointRadius: 0, tension: 0.3 },
      { label: "rear_right", data: [], borderColor: "#ffb84d", borderWidth: 2, pointRadius: 0, tension: 0.3 },
    ]
  },
  options: { ...chartDefaults, plugins: { legend: { display: true, labels: { color: "#8b98a5", boxWidth: 10, font: { size: 10 } } } } }
});

function pushPoint(chart, datasetIndex, tick, value) {
  const ds = chart.data.datasets[datasetIndex];
  chart.data.labels.push(tick);
  ds.data.push(value);
  if (ds.data.length > MAX_POINTS) {
    ds.data.shift();
    if (datasetIndex === 0) chart.data.labels.shift();
  }
  chart.update("none");
}

function connect() {
  const ws = new WebSocket(BACKEND_WS);

  ws.onopen = () => {
    document.getElementById("statusDot").classList.add("connected");
    document.getElementById("statusText").textContent = "Connected — live telemetry streaming";
  };

  ws.onclose = () => {
    document.getElementById("statusDot").classList.remove("connected");
    document.getElementById("statusText").textContent = "Disconnected — retrying in 2s...";
    setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (event) => {
    const d = JSON.parse(event.data);

    document.getElementById("batteryStat").textContent = d.battery_pct + "%";
    document.getElementById("tiltStat").textContent = d.tilt_deg + "°";
    document.getElementById("commsStat").textContent = d.comms_signal + "%";
    document.getElementById("motorStat").textContent =
      Object.entries(d.motor_temp).map(([k, v]) => `${k}: ${v}°C`).join(" · ");

    pushPoint(batteryChart, 0, d.tick, d.battery_pct);
    pushPoint(tiltChart, 0, d.tick, d.tilt_deg);
    pushPoint(commsChart, 0, d.tick, d.comms_signal);

    const wheels = ["front_left", "front_right", "rear_left", "rear_right"];
    motorChart.data.labels.push(d.tick);
    if (motorChart.data.labels.length > MAX_POINTS) motorChart.data.labels.shift();
    wheels.forEach((wheel, i) => {
      const ds = motorChart.data.datasets[i];
      ds.data.push(d.motor_temp[wheel]);
      if (ds.data.length > MAX_POINTS) ds.data.shift();
    });
    motorChart.update("none");

    // Real anomaly detection result from the backend's Isolation Forest + z-score model
    if (d.anomaly && d.anomaly.is_anomaly) {
      const topFeature = d.anomaly.top_contributing_features[0];
      const detail = topFeature
        ? `${topFeature.feature} (z=${topFeature.z_score})`
        : "unspecified";
      addAlert(`Tick ${d.tick}: anomaly detected via ${d.anomaly.detected_by} — ${detail}`);
    }
  };
}

function addAlert(msg) {
  const feed = document.getElementById("alertFeed");
  const item = document.createElement("div");
  item.className = "alert-item";
  item.textContent = msg;
  feed.prepend(item);
  while (feed.children.length > 8) feed.removeChild(feed.lastChild);
}

async function injectFault(fault_type, target) {
  await fetch(`${BACKEND_HTTP}/api/inject_fault`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fault_type, target, magnitude: 1.5, duration_ticks: 15 })
  });
  addAlert(`Injected fault: ${fault_type} (${target})`);
}

connect();
</script>
</body>
</html>
